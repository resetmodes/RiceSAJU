<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밥사주</title>
<link rel="icon" href="bab.png">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root { --paper:#FAF6F0; --ink:#1A1A1A; --stamp:#E8442E; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--paper); color:var(--ink); font-family:'Gowun Dodum', sans-serif; font-size:17px; -webkit-font-smoothing:antialiased;
         min-height:100dvh; display:flex; flex-direction:column; align-items:center; overflow-x:hidden; }
  #app { width:100%; max-width:420px; padding:24px 20px 60px; }

  /* 손그림 테두리 — 유기적 border-radius */
  .doodle { border:2.5px solid var(--ink); background:var(--paper);
            border-radius:255px 15px 225px 15px / 15px 225px 15px 255px; }
  .doodle.b { border-radius:15px 255px 15px 225px / 225px 15px 255px 15px; }

  h1.logo { font-family:Gaegu, sans-serif; font-size:54px; font-weight:700; letter-spacing:2px; transform:rotate(-2deg); text-align:center; line-height:1; margin:8px 0 2px; }
  .sub { font-family:Gaegu, sans-serif; text-align:center; font-size:18px; transform:rotate(1deg); opacity:.9; margin-bottom:18px; }

  .bab { display:block; width:180px; margin:0 auto; }
  .bab.spin-hat { animation:none; }

  button { font:inherit; font-family:Gaegu, sans-serif; font-weight:700; color:var(--ink); background:var(--paper); cursor:pointer;
           border:2.5px solid var(--ink); padding:10px 18px; font-size:20px;
           border-radius:255px 15px 225px 15px / 15px 225px 15px 255px; transform:rotate(-.6deg); }
  button:active { transform:rotate(-.6deg) scale(.96); }
  button.big { display:block; width:100%; padding:16px; font-size:26px; margin-top:20px; transform:rotate(.4deg); }
  button.stamp-btn { background:var(--stamp); color:#fff; border-color:var(--ink); }

  input, select { font:inherit; font-size:18px; color:var(--ink); background:transparent; width:100%;
           border:none; border-bottom:2.5px solid var(--ink); padding:6px 4px; outline:none; }
  label { display:block; font-size:15px; opacity:.9; margin:16px 0 0; transform:rotate(-.5deg); }
  .row { display:flex; gap:12px; }

  /* 기분 스티커 */
  .moods { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:14px; }
  .mood { font-family:Gaegu, sans-serif; padding:12px 2px; text-align:center; font-size:17px; font-weight:700; user-select:none; word-break:keep-all; }
  .mood span { display:block; font-size:26px; font-weight:300; line-height:1.2; }
  .mood.on { background:var(--ink); color:var(--paper); }
  .mood:nth-child(odd){ transform:rotate(-1.4deg); } .mood:nth-child(even){ transform:rotate(1.2deg); }

  .card { padding:18px; margin-top:18px; transform:rotate(-.4deg); }
  .memo { font-family:Gaegu, sans-serif; font-size:19px; opacity:.95; }

  /* 부적 — 끈 구멍 달린 패 모양, 노란 부적 종이 + 빨간 속테두리 */
  .buja { position:relative; width:100%; max-width:360px; margin:34px auto 0; padding:30px 22px 34px; text-align:center; background:#FFFBEA;
          border:3px solid var(--ink); border-radius:38px 42px 30px 34px / 44px 38px 34px 30px;
          transform:rotate(1.2deg); transform-origin:top center; animation:unfold .9s ease-out; }
  .buja::before { content:''; position:absolute; top:-15px; left:50%; margin-left:-11px; width:16px; height:16px;
                  border:3px solid var(--ink); border-radius:50%; background:var(--paper); }
  .buja::after { content:''; position:absolute; inset:8px; pointer-events:none;
                 border:2px solid rgba(232,68,46,.5); border-radius:30px 34px 24px 28px / 36px 30px 28px 24px; }
  .buja .seal { position:absolute; right:14px; bottom:12px; width:34px; height:34px; z-index:1;
                font-family:Gaegu, sans-serif; font-size:22px; font-weight:700; line-height:32px;
                color:var(--stamp); border:2.5px solid var(--stamp); border-radius:6px 10px 6px 10px;
                transform:rotate(6deg); opacity:.85; }
  .buja .tw { position:absolute; color:var(--stamp); font-size:15px; animation:twinkle 1.6s ease-in-out infinite; }
  .buja .tw1 { left:16px; top:88px; } .buja .tw2 { right:18px; top:120px; animation-delay:.8s; }
  @keyframes twinkle { 0%,100%{ opacity:.25; transform:scale(.8) rotate(0deg) } 50%{ opacity:1; transform:scale(1.15) rotate(20deg) } }
  .babsym { display:block; margin:0 auto 6px; width:56px; }
  .ritual .babsym { width:80px; margin:0 auto 14px; animation:wobble .5s ease-in-out infinite alternate; }
  /* 뒤에 깔린 부적 심볼들 */
  #charms { position:fixed; inset:0; pointer-events:none; z-index:0; }
  #charms img { position:absolute; opacity:.12; animation:floaty 7s ease-in-out infinite; }
  @keyframes floaty { 0%,100%{ transform:translateY(0) rotate(var(--r,0deg)) } 50%{ transform:translateY(-9px) rotate(var(--r,0deg)) } }
  #app { position:relative; z-index:1; }
  @keyframes unfold { 0%{ transform:rotate(1.2deg) scaleY(.05); opacity:0 } 60%{ transform:rotate(1.2deg) scaleY(1.06) } 100%{ transform:rotate(1.2deg) scaleY(1); opacity:1 } }
  .buja .head { font-family:Gaegu, sans-serif; font-size:16px; letter-spacing:6px; opacity:.8; }
  .buja .stamp { font-family:Gaegu, sans-serif; display:inline-block; margin:12px 0 4px; padding:10px 16px; font-size:34px; word-break:keep-all; font-weight:700; line-height:1.1;
                 color:var(--stamp); border:3.5px solid var(--stamp); transform:rotate(-3deg);
                 border-radius:220px 18px 200px 14px / 16px 200px 14px 220px; }
  .buja .cat { font-size:15px; opacity:.9; }
  .buja .why { text-align:left; font-size:15px; margin:14px 0 0; padding-top:12px; border-top:2px dashed var(--ink); }
  .buja .why li { list-style:none; margin:5px 0; }
  .buja .why li::before { content:'✏️ '; }
  .buja .alts { font-size:14px; opacity:.9; margin-top:12px; }
  .fortunes { text-align:left; font-size:14.5px; margin-top:12px; padding-top:12px; border-top:2px dashed var(--ink); }
  .fortunes .ft { margin:7px 0; }
  .fortunes .ilgan { font-size:12px; opacity:.8; }
  .pairs { font-size:15px; margin-top:12px; padding-top:12px; border-top:2px dashed var(--ink); }
  .pairs div { margin:3px 0; }
  .avoid { margin-top:14px; padding-top:12px; border-top:2px dashed var(--ink); }
  .avoid .no { font-family:Gaegu, sans-serif; font-size:22px; font-weight:700; text-decoration:line-through; text-decoration-thickness:3px; text-decoration-color:var(--stamp); transform:rotate(-1deg); display:inline-block; }
  .avoid .rsn { font-size:14px; opacity:.9; }
  .payer { margin-top:16px; padding-top:14px; border-top:2px dashed var(--ink); }
  .payer .who { font-family:Gaegu, sans-serif; font-size:26px; font-weight:700; color:var(--stamp); transform:rotate(-1.5deg); display:inline-block; }
  .payer .rsn { font-size:14px; opacity:.9; }

  .roster { margin-top:14px; padding-top:12px; border-top:2px dashed var(--ink); }
  .roster .rt { font-size:14px; opacity:.9; margin-bottom:6px; }
  .roster .mb { display:inline-block; margin:3px 4px 3px 0; padding:4px 12px; font-size:15px; font-weight:700;
                border:2px solid var(--ink); border-radius:200px 14px 180px 12px / 12px 180px 14px 200px; }
  .roster .mb.done { background:var(--ink); color:var(--paper); }
  .roster .mb.pick { cursor:pointer; }
  .fortunes .stars { color:var(--stamp); letter-spacing:2px; }
  .fortunes .remedy { font-size:13px; opacity:.85; }
  .fortunes .gj { font-size:12px; opacity:.7; letter-spacing:1px; }
  .status { font-size:14px; margin-top:14px; opacity:.9; transform:rotate(.5deg); }
  .err { color:var(--stamp); font-weight:700; margin-top:12px; }
  .hidden { display:none; }

  /* 의식 화면: 무당 멘트가 차례로 지나감 */
  .ritual { text-align:center; margin-top:36px; font-family:Gaegu, sans-serif; font-size:26px; font-weight:700; min-height:80px; }
  .ritual .om { animation:omIn .5s ease-out; }
  @keyframes omIn { from{ opacity:0; transform:translateY(10px) rotate(-1deg) } to{ opacity:1; transform:none } }
  .ritual .dots { font-size:18px; opacity:.6; margin-top:8px; letter-spacing:4px; }

  /* 도장 쾅 */
  .buja .stamp { animation:slam .5s cubic-bezier(.2,1.6,.4,1) .55s backwards; }
  @keyframes slam { 0%{ transform:scale(3) rotate(10deg); opacity:0 } 60%{ transform:scale(.92) rotate(-4deg); opacity:1 } 100%{ transform:scale(1) rotate(-3deg) } }
  @keyframes quake { 0%,100%{ transform:rotate(1.2deg) } 25%{ transform:rotate(.4deg) translate(2px,1px) } 75%{ transform:rotate(2deg) translate(-2px,0) } }

  /* 전적판 */
  .board .rank { display:flex; align-items:baseline; gap:8px; margin:6px 0; font-size:16px; }
  .board .rank b { font-size:19px; }
  .board .bar { flex:1; border-bottom:2.5px dotted var(--ink); opacity:.4; }
  .board .cnt { font-family:Gaegu, sans-serif; font-size:22px; font-weight:700; color:var(--stamp); }

  /* 로딩: 밥이가 러프 버전으로 흐트러지며 갸웃갸웃 */
  .loading .bab { content:url('bab-rough.png'); animation:wobble .5s ease-in-out infinite alternate; }
  @keyframes wobble { from{ transform:rotate(-5deg) } to{ transform:rotate(5deg) } }
  .blink { animation:blink 4s infinite; }
  @keyframes blink { 0%,94%,100%{opacity:1} 96%,98%{opacity:0} }
</style>
</head>
<body>
<div id="charms" aria-hidden="true"></div>
<div id="app">
  <img class="bab blink" src="bab.png" alt="밥이">
  <h1 class="logo">밥사주</h1>
  <p class="sub">사주 보고 점심 정하면 되눈 거 아니노!!<br>본사 도보권 한정이야</p>
  <div id="view"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const MOODS = [['신남','🤩'],['피곤','🥱'],['빡침','🤬'],['꿀꿀','☁️'],['설렘','💓'],['무념','🧘'],['현타','🫠'],['텐션최고','⚡'],['샤갈같음','🎨'],['퇴사마려움','📦'],['월급루팡','🦹'],['숙취','🍺']];
let team = location.hash.slice(1).trim().toLowerCase();
let me = localStorage.getItem('bapsaju:name') || '';
let myMood = null;

const api = (body) => fetch('/api/team' + (body ? '' : '?team=' + encodeURIComponent(team)), body ? {
  method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ team, ...body })
} : undefined).then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || '꼬임'); return j; });

// 밥 심볼 누끼 — 부적 머리엔 4번(반짝이 합자), 의식엔 2번(유령 패)
const BABSYM = `<img class="babsym" src="sym4.png" alt="">`;
const RITSYM = `<img class="babsym" src="sym2.png" alt="">`;
// 뒤 배경에 심볼 흩뿌리기 — [번호, left%, top%, 크기px, 회전deg]
const CHARMS = [
  [2, 4, 6, 54, -8], [9, 78, 4, 62, 6], [7, 88, 26, 48, -5],
  [3, 2, 36, 56, 7], [5, 90, 55, 50, -7], [1, 3, 66, 52, 5],
  [6, 86, 78, 54, -6], [8, 6, 88, 46, 8], [4, 82, 93, 44, -4],
];
document.getElementById('charms').innerHTML = CHARMS.map(([n,l,t,s,r],i) =>
  `<img src="sym${n}.png" style="left:${l}%;top:${t}%;width:${s}px;--r:${r}deg;animation-delay:${i*.7}s">`).join('');
function render(html){ $('#view').innerHTML = html; }
function err(m){ const e = $('#err'); if (e) e.textContent = m; }

// ── 화면 1: 팀 코드 ──
function screenTeam(){
  render(`
    <div class="card doodle">
      <label>팀 암호를 마래봐 (영문·숫자·하이픈. 팀끼리만 아눈 걸로)</label>
      <input id="tc" placeholder="예: media-team" value="${team||''}">
      <button class="big" onclick="goTeam()">입장하겟습니까 습~ 꿀꺽</button>
      <div class="err" id="err"></div>
    </div>`);
}
window.goTeam = () => {
  const t = $('#tc').value.trim().toLowerCase();
  if (!/^[a-z0-9-]{2,32}$/.test(t)) return err('영문 소문자·숫자·하이픈 2~32자로 마래봐;;');
  team = t; location.hash = t; boot();
};

// ── 화면 2: 프로필 등록 ──
async function screenJoin(){
  let existing = [];
  try { existing = (await api()).members || []; } catch {}
  const claimBlock = existing.length ? `
      <div class="roster">
        <div class="rt">이미 사주 맡긴 사람은 이름만 찍으면 되눈 거야 (폰 바꿔도 됨)</div>
        ${existing.map(n=>`<span class="mb pick" onclick="claim('${n.replace(/'/g,"\\'")}')">${n}</span>`).join('')}
      </div>` : '';
  render(`
    <div class="card doodle b">
      <div class="memo">처음 보눈 얼굴이군.<br>사주부터 맡기면 되눈 거 아니노</div>
      ${claimBlock}
      <label>이름 (팀에서 부르눈 그 이름으로)</label>
      <input id="nm" maxlength="12" value="${me||''}">
      <label>생년월일 (사주 봐야 하니까 솔직하게 마래봐)</label>
      <div class="row">
        <input id="by" inputmode="numeric" placeholder="1992">
        <input id="bm" inputmode="numeric" placeholder="3">
        <input id="bd" inputmode="numeric" placeholder="15">
      </div>
      <label>태어난 시 (모르면 그냥 둬. 엄마한테 여쭤보면 되잖아)</label>
      <select id="bh"><option value="">몰라</option>${Array.from({length:24},(_,h)=>`<option value="${h}">${h}시</option>`).join('')}</select>
      <button class="big" onclick="join()">사주 맡기겟어</button>
      <div class="err" id="err"></div>
    </div>`);
}
window.claim = (name) => { me = name; localStorage.setItem('bapsaju:name', name); screenMood(); };
window.join = async () => {
  const name = $('#nm').value.trim(), y = +$('#by').value, m = +$('#bm').value, d = +$('#bd').value, hour = $('#bh').value;
  if (!name) return err('이름을 마래봐!!');
  if (!(y>1920 && y<2020 && m>=1 && m<=12 && d>=1 && d<=31)) return err('생년월일이 상당히 이상하군;;');
  try { await api({ action:'join', name, birth:{ y, m, d, hour } });
    me = name; localStorage.setItem('bapsaju:name', name); screenMood(); } catch(e){ err(e.message); }
};

// ── 화면 3: 오늘 기분 + 뽑기 ──
async function screenMood(){
  let st = { members:[], moods:{} };
  try { st = await api(); } catch {}
  const doneNames = Object.keys(st.moods);
  render(`
    <div class="card doodle">
      <div class="memo">${me} 왓구나!!<br>오늘 기붕이 어때? 하나 찍어봐</div>
      <div class="moods">${MOODS.map(([m,e])=>`
        <div class="mood doodle ${st.moods[me]===m?'on':''}" onclick="setMood('${m}',this)"><span>${e}</span>${m}</div>`).join('')}
      </div>
      <div class="roster">
        <div class="rt">오늘의 참가자 ${st.members.length}명 — 기붕 찍으면 검은 도장 쾅</div>
        ${st.members.map(n=>`<span class="mb ${st.moods[n]?'done':''}">${n}${st.moods[n]?' '+(MOODS.find(x=>x[0]===st.moods[n])||['',''])[1]:''}</span>`).join('') || '아직 아무도 없군;;'}
        <div class="rt" style="margin-top:6px">기붕 접수 완료 ${doneNames.length}명. 다 찍어야 사주가 잘 나오눈 거 아니노</div>
      </div>
      <button class="big stamp-btn" onclick="draw()">부적 뽑기</button>
      <div class="err" id="err"></div>
      <button class="big" onclick="screenStats()" style="font-size:20px;padding:10px">📊 이번 달 전적판</button>
      <button class="big" onclick="invite()" style="font-size:20px;padding:10px">👋 팀원을 끌고 오겟어</button>
      <div class="status" style="text-align:right"><a href="#" onclick="screenJoin();return false" style="color:inherit">사주 다시 맡기겟어</a></div>
    </div>`);
}
window.setMood = async (m, el) => {
  document.querySelectorAll('.mood').forEach(x=>x.classList.remove('on'));
  el.classList.add('on'); myMood = m;
  try { await api({ action:'mood', name: me, mood: m }); screenMood(); } catch(e){ err(e.message); }
};
const OMENS = ['생년월일을 대조하겟습니다 습~ 꿀꺽', '오행 개수를 세눈 중', '본사 기운을 읽눈 중', '어제 먹은 게 뭐엿더라..', '도장을 찍으면 되눈 거 아니노'];
async function ritual(body){
  document.body.classList.add('loading'); err('');
  render('<div class="ritual">' + RITSYM + '<div class="om" id="om"></div><div class="dots">···</div></div>');
  let i = 0, alive = true;
  const tick = () => { if (!alive) return; const el = $('#om'); if (el){ el.textContent = OMENS[Math.min(i++, OMENS.length-1)] + '…'; el.classList.remove('om'); void el.offsetWidth; el.classList.add('om'); } };
  tick(); const iv = setInterval(tick, 550);
  try {
    const [r] = await Promise.all([api(body), new Promise(z=>setTimeout(z, 2400))]);
    alive = false; clearInterval(iv);
    screenResult(r);
  } catch(e){ alive = false; clearInterval(iv); alert(e.message); screenMood(); }
  document.body.classList.remove('loading');
}
window.draw = () => ritual({ action:'draw' });

// ── 화면 4: 결과 부적 ──
const DEFY_MSG = [
  '운명을 한 번 거슬럿어. 상당히 실망이야',
  '사주가 흔들리잖아!! 어이가 없다노!!',
  '⚠️ 계속 이러면 그냥 먹고 싶은 거 먹으면 되눈 거 아니노',
];
function screenResult(r){
  window._last = r;
  const w = r.weather ? `${r.weather.tag} ${Math.round(r.weather.temp)}도` : '날씨는 하늘만 앎';
  const defy = r.defy;
  const whyBlock = defy
    ? `<ul class="why"><li>그만 좀 거슬러!! 난 실망햇어 상당히 ㅡㅡ</li><li>니들이 진짜 원하눈 음식: <b>${defy.category}</b></li><li>그냥 이거 먹으면 되잖아</li></ul>`
    : `<ul class="why">${r.reasons.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  const avoidBlock = r.avoid ? `
      <div class="avoid">
        <div class="memo">🚫 오늘 여기 가면 안 되눈 거야</div>
        <div class="no">${r.avoid.n}</div>
        <div class="rsn">${r.avoid.why}</div>
      </div>` : '';
  const m = r.match || {};
  const matchBlock = (m.best || m.worst) ? `
      <div class="pairs">
        ${m.best ? `<div>💞 오늘의 밥궁합: <b>${m.best.a} ♥ ${m.best.b}</b></div>` : ''}
        ${m.worst ? `<div>⚡ 오늘의 밥상극: <b>${m.worst.a} ✕ ${m.worst.b}</b> — 마주 앉으면 안 되겟군</div>` : ''}
      </div>` : '';
  const defyLabel = r.rejects >= 3 ? '인정하겟어' : '운명 거스르기';
  const defyNote = r.rejects > 0 && r.rejects <= 3 ? `<div class="status" style="text-align:center">${DEFY_MSG[Math.min(r.rejects,3)-1]}</div>` : '';
  render(`
    ${defyNote}
    <div class="buja">
      ${BABSYM}
      <span class="tw tw1">✦</span><span class="tw tw2">✧</span>
      <div class="seal">밥</div>
      <div class="head">${defy ? '사 주 파 업 부 적' : '오 늘 의 점 심 부 적'}</div>
      <div class="memo">${r.todayGanji}일 · ${w} · ${r.count}명 합산</div>
      <div class="stamp" style="font-size:${r.pick.n.length>8?22:r.pick.n.length>5?27:34}px">${r.pick.n}</div>
      <div class="cat">${r.pick.c} · 본사에서 도보 ${r.pick.d}분 · ${'₩'.repeat(r.pick.p)}<br><a href="https://map.naver.com/p/search/${encodeURIComponent(r.pick.n+' 삼성동')}" target="_blank" style="color:inherit">🗺 길찾기 열기</a></div>
      ${whyBlock}
      <div class="alts">꿩 대신 닭: ${r.alts.map(a=>a.n).join(' / ')}</div>
      <div class="fortunes">
        <div class="rt" style="font-weight:700">📜 오늘의 사주풀이</div>
        ${r.fortunes.map(f=>`<div class="ft"><b>${f.name}</b> <span class="stars">${'★'.repeat(f.stars||3)}${'☆'.repeat(5-(f.stars||3))}</span> <span class="ilgan">${f.godLabel||''}</span><br>${f.line}${f.remedy?`<br><span class="remedy">💊 ${f.remedy}</span>`:''}</div>`).join('')}
      </div>
      ${matchBlock}
      ${avoidBlock}
      <div class="payer">
        <div class="memo">💸 오늘 밥살 사람</div>
        <div class="who">${r.payer.name}</div>
        <div class="rsn">${r.payer.reason}</div>
      </div>
    </div>
    <button class="big" onclick="shareBuja()">📸 부적을 단톡에 소문내겟어</button>
    ${r.rejects >= 3 ? '' : `<button class="big" onclick="defyFate('${r.pick.n.replace(/'/g,"\\'")}')">${defyLabel}</button>`}
    <button class="big" onclick="screenMood()">기붕 다시 찍으러 가겟어</button>
    <div class="err" id="err"></div>`);
}
window.defyFate = (place) => ritual({ action:'reject', place, name: me });

// 부적을 이미지로 그려서 공유/저장 — 라이브러리 없이 캔버스 수작업
window.shareBuja = async () => {
  const r = window._last; if (!r) return;
  await document.fonts.ready;
  const W = 640, pad = 44, S = 2; // S: 레티나 배율
  const lines = []; // [text, font, size, color, gap, align]
  const G = s => `700 ${s}px Gaegu`, D = s => `${s}px 'Gowun Dodum'`;
  lines.push([r.defy ? '사 주 파 업 부 적' : '오 늘 의 점 심 부 적', G(22), '#1A1A1A', 14, 'c']);
  const wtxt = r.weather ? `${r.weather.tag} ${Math.round(r.weather.temp)}도` : '날씨는 하늘만 앎';
  lines.push([`${r.todayGanji}일 · ${wtxt} · ${r.count}명 합산`, D(18), '#666', 30, 'c']);
  lines.push(['@STAMP@' + r.pick.n, G(r.pick.n.length > 8 ? 38 : 48), '#E8442E', 20, 'c']);
  lines.push([`${r.pick.c} · 도보 ${r.pick.d}분 · ${'₩'.repeat(r.pick.p)}`, D(19), '#444', 26, 'c']);
  const whys = r.defy ? ['그만 좀 거슬러!!!! 사주 안 볼래 ㅡㅡ', `당신들이 진짜 원하는 음식: ${r.defy.category}`] : r.reasons;
  for (const x of whys) lines.push(['✏️ ' + x, D(17), '#1A1A1A', 10, 'l']);
  lines.push(['', D(4), '#000', 16, 'l']);
  lines.push(['📜 오늘의 사주풀이', G(20), '#1A1A1A', 12, 'l']);
  for (const f of r.fortunes) {
    lines.push([`${f.name} ${'★'.repeat(f.stars||3)}${'☆'.repeat(5-(f.stars||3))}`, D(17), '#E8442E', 4, 'l']);
    lines.push([f.line, D(15), '#333', 10, 'l']);
  }
  if (r.payer) {
    lines.push(['', D(4), '#000', 16, 'l']);
    lines.push(['💸 오늘 밥살 사람: ' + r.payer.name, G(26), '#E8442E', 8, 'l']);
    lines.push([r.payer.reason, D(15), '#333', 10, 'l']);
  }
  // 줄바꿈 계산
  const cv = document.createElement('canvas'), g = cv.getContext('2d');
  const wrapped = [];
  for (const [t, f, col, gap, al] of lines) {
    g.font = f;
    const maxW = W - pad * 2, stamp = t.startsWith('@STAMP@');
    const txt = stamp ? t.slice(7) : t;
    let cur = '';
    for (const ch of txt) {
      if (g.measureText(cur + ch).width > maxW && cur) { wrapped.push([cur, f, col, 4, al, false]); cur = ch; }
      else cur += ch;
    }
    wrapped.push([cur, f, col, gap, al, stamp]);
  }
  let H = pad + 10;
  for (const [t, f, , gap] of wrapped) { g.font = f; H += parseInt(f.match(/(\d+)px/)[1]) * 1.25 + gap; }
  H += pad;
  cv.width = W * S; cv.height = H * S; g.scale(S, S);
  g.fillStyle = '#FFFBEA'; g.fillRect(0, 0, W, H);
  // 손그림 테두리 두 겹 + 끈 구멍
  g.strokeStyle = '#1A1A1A'; g.lineWidth = 3;
  g.strokeRect(14, 14, W - 28, H - 28);
  g.strokeStyle = '#E8442E'; g.lineWidth = 1.5;
  g.strokeRect(22, 22, W - 44, H - 44);
  g.beginPath(); g.arc(W / 2, 14, 9, 0, 7); g.fillStyle = '#FAF6F0'; g.fill();
  g.strokeStyle = '#1A1A1A'; g.lineWidth = 3; g.stroke();
  // 낙관 도장
  g.save(); g.translate(W - 62, H - 62); g.rotate(.1);
  g.strokeStyle = '#E8442E'; g.lineWidth = 2.5; g.strokeRect(-19, -19, 38, 38);
  g.fillStyle = '#E8442E'; g.font = '700 26px Gaegu'; g.textAlign = 'center'; g.fillText('밥', 0, 9);
  g.restore();
  let y = pad + 10;
  for (const [t, f, col, gap, al, stamp] of wrapped) {
    g.font = f; const size = parseInt(f.match(/(\d+)px/)[1]); y += size;
    const x = al === 'c' ? W / 2 : pad;
    g.textAlign = al === 'c' ? 'center' : 'left';
    if (stamp) { // 도장 테두리
      const tw = g.measureText(t).width;
      g.save(); g.translate(W / 2, y - size * .38); g.rotate(-.05);
      g.strokeStyle = '#E8442E'; g.lineWidth = 4;
      g.strokeRect(-tw / 2 - 18, -size * .72, tw + 36, size * 1.45);
      g.restore();
    }
    g.fillStyle = col; g.fillText(t, x, y);
    y += size * .25 + gap;
  }
  cv.toBlob(async blob => {
    const file = new File([blob], 'bapsaju.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch {}
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'bapsaju.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
};

window.invite = async () => {
  const url = location.origin + location.pathname + '#' + team;
  const text = '점심 사주 보러 오겟습니까 습~ 꿀꺽. 이름이랑 생일만 넣으면 되눈 거야\n' + url;
  if (navigator.share) { try { await navigator.share({ text }); return; } catch {} }
  try { await navigator.clipboard.writeText(text); err(''); alert('초대 문구 복사햇어!! 단톡에 붙여넣으면 되눈 거 아니노'); }
  catch { prompt('이거 복사해서 단톡에 붙여넣으면 되눈 거야', text); }
};

// ── 화면 5: 이번 달 전적판 ──
window.screenStats = async () => {
  let st = { stats: { pay: {}, defy: {} } };
  try { st = await api(); } catch (e) { alert(e.message); return; }
  const s = st.stats || { pay: {}, defy: {} };
  const rank = obj => Object.entries(obj).sort((a, b) => b[1] - a[1]);
  const pays = rank(s.pay), defies = rank(s.defy);
  const medal = i => ['🥇', '🥈', '🥉'][i] || '💸';
  const row = (icon, name, n, unit) => `<div class="rank"><b>${icon} ${name}</b><span class="bar"></span><span class="cnt">${n}${unit}</span></div>`;
  render(`
    <div class="card doodle">
      <div class="memo">📊 이번 달 전적판<br>사주는 다 기억하고 잇어</div>
      <div class="roster board">
        <div class="rt" style="font-weight:700">💸 밥살 운명에 당첨된 횟수</div>
        ${pays.length ? pays.map(([n, c], i) => row(medal(i), n, c, '번')).join('') : '<div class="rank">아직 아무도 안 삿군. 수상할 정도로 평화로워;;</div>'}
      </div>
      <div class="roster board">
        <div class="rt" style="font-weight:700">🙅 운명 거스르기 최다 시도</div>
        ${defies.length ? defies.map(([n, c], i) => row(i === 0 ? '⚡' : '🌀', n, c, '회')).join('') : '<div class="rank">다들 순순히 운명을 받아들엿군. 착해</div>'}
      </div>
      ${defies.length ? `<div class="status">${defies[0][0]} — 사주가 널 주시하고 잇어;;</div>` : ''}
      <button class="big" onclick="screenMood()">기붕 찍으러 돌아가겟어</button>
    </div>`);
};

function boot(){
  if (!team) return screenTeam();
  if (!me) return screenJoin();
  screenMood();
}
boot();
</script>
